name: Extended browser matrix

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-matrix:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox-desktop
            browser: firefox
          - project: webkit-desktop
            browser: webkit
          - project: webkit-mobile
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec playwright install-deps chromium
      - run: node scripts/chrome-for-testing.mjs
      - run: pnpm run test:browser --project=${{ matrix.project }}

  browser-matrix-result:
    name: Firefox, WebKit and mobile emulation
    if: always()
    needs: browser-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser project to pass
        env:
          MATRIX_RESULT: ${{ needs.browser-matrix.result }}
        run: test "$MATRIX_RESULT" = success
