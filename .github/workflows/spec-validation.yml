name: Initial specification validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Documentation and artifact schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:ci

  bootstrap:
    name: Bootstrap quality, unit, browser and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Quality, build and unit tests
        run: pnpm run check
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Chromium and axe smoke
        run: pnpm run test:browser --project=chromium-desktop --project=chromium-mobile
      - name: Built CLI startup
        run: |
          output="$(node apps/cli/dist/main.js)"
          test "$output" = '{"name":"mimic","state":"ready"}'
          printf '%s\n' "$output"
