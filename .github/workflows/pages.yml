name: Publish Mimic to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'knowledge/decision-material-selection.md'
      - 'knowledge/grouping.md'
      - 'knowledge/visual-hierarchy.md'
      - 'prototypes/decision-material-selection/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix develop --no-update-lock-file --command bun install --frozen-lockfile --ignore-scripts
      - run: nix develop --no-update-lock-file --command bun run build:pages
      - run: nix develop --no-update-lock-file --command bun run verify
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
