skillId: mimic.s04.system-capability
manifestVersion: 1.0.0
packageVersion: 0.1.0
skillFile: SKILL.md
inputs:
  required: []
  optional:
    - name: product-context
      kind: artifact
      artifactType: product-definition
      schemaVersion: 1.0.0
  alternatives:
    - name: system-source
      oneOf:
        - name: system-documentation
          kind: evidence-file
        - name: executable-evidence
          kind: evidence-file
