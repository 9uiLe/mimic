    authority: PROPOSE_ONLY
supportedArtifactSchemas:
  - artifactType: product-definition
    schemaVersion: 1.0.0
  - artifactType: system-capability
    schemaVersion: 1.0.0
  - artifactType: system-request
    schemaVersion: 1.0.0
examples: [examples/source.json]
tests: [tests/contract-case.json]
