<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mimic workspace monitor</title><style nonce="YpygbirXkE3HKOdiMiMoHDw71ZWK79WU">:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#eef3f0;color:#183430;font:16px/1.55 system-ui,sans-serif}main{max-width:1360px;margin:auto;padding:34px 24px 70px}h1{font-size:clamp(27px,3vw,39px);line-height:1.2;margin:6px 0 12px}h2{font-size:21px;line-height:1.3}h3{font-size:16px;margin-top:28px}h4{font-size:14px}h1,h2,h3,h4,.run-row strong,.ref{overflow-wrap:anywhere}p{margin:10px 0}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#39746c}.intro{max-width:82ch;color:#415b56}.meta{display:flex;gap:14px 26px;flex-wrap:wrap;align-items:center;padding:15px 0;border-top:1px solid #cbdad3;border-bottom:1px solid #cbdad3;margin:24px 0}#connection{font-weight:650;color:#155b42}#connection[data-state=disconnected]{color:#9b3425}#summary{font-weight:650}.stage-note{font-size:14px;color:#49645e}.preview,#run-detail,.run-index{background:#fff;border:1px solid #cadbd3;border-radius:14px;box-shadow:0 5px 24px #173f3009}.preview{padding:20px 24px;margin:26px 0}.preview h2{margin:0 0 8px}.preview a{display:inline-block;margin-top:8px;font-weight:700}.run-tools{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:34px 0 12px}.run-tools label{display:block;font-weight:700}.run-tools input{display:block;font:inherit;width:min(100%,420px);padding:11px 13px;border:1px solid #8daaa1;border-radius:8px;margin-top:6px}.run-tools input:focus-visible,.run-row:focus-visible,.table-scroll:focus-visible,a:focus-visible{outline:3px solid #1678a3;outline-offset:3px}#run-count{font-size:14px;color:#415b56}.run-browser{display:grid;grid-template-columns:minmax(250px,340px) minmax(0,1fr);gap:18px;align-items:start}.run-index{overflow:hidden}.run-index h2{font-size:15px;margin:0;padding:16px 20px;border-bottom:1px solid #dce7e0}.run-list{max-height:min(70vh,810px);overflow:auto}.run-row{display:block;width:100%;border:0;border-bottom:1px solid #e2eae5;background:white;text-align:left;padding:14px 18px;cursor:pointer;color:inherit;font:inherit}.run-row:hover{background:#f3f8f5}.run-row[aria-current=true]{background:#e3f2e9;border-left:4px solid #137765;padding-left:14px}.run-row strong,.run-row span{display:block}.run-row strong{font:600 13px/1.4 ui-monospace,monospace}.run-row span{color:#526b64;font-size:13px;margin-top:6px}#run-detail{padding:22px 26px;min-width:0;min-height:320px}#run-detail h2{margin:6px 0 18px}.detail-status{padding:11px 14px;background:#edf6f0;border-left:3px solid #137765;font-weight:650}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:460px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #e5eee8;padding:10px;overflow-wrap:anywhere}th{font-size:13px;color:#466159}.ref{font:13px/1.7 ui-monospace,monospace;border-bottom:1px solid #e5eee8;padding:8px 0}.session{border-left:3px solid #abc9bb;padding:2px 0 2px 16px;margin:14px 0}a{color:#086554}[data-stale=true]{opacity:.65}[hidden]{display:none!important}#selection-note{color:#6c5221;font-size:14px}iframe{width:100%;height:78vh;border:1px solid #dce4ef;background:white}@media(max-width:720px){main{padding:20px 14px 48px}.run-browser{grid-template-columns:1fr}.run-list{max-height:280px}#run-detail{padding:18px}.preview{padding:18px}.meta{display:block}}</style><script src="/monitor.js" defer></script></head><body><main><p class="eyebrow">Mimic / Workspace monitor</p><h1>Run の保存状態を確認する</h1><p class="intro">Run を検索して選ぶと、Task・セッション・成果物の exact refs を右側に表示します。生成・承認・再開の操作はありません。保存状態は承認や backend 接続の証明ではありません。</p><div class="meta"><p id="connection" data-testid="connection-status" role="status" aria-live="polite">接続確認中</p><p id="summary"></p></div><p class="stage-note">段階: システム → プロダクト → 体験 → デザイン → 検証 / レビュー。出力型に基づく分類で、段階の完了を示しません。</p><section class="preview"><h2>別途選択した既存プロダクト preview</h2><p id="preview-state">確認中</p><a id="product-preview-link" href="/preview" target="_blank" rel="noopener noreferrer" hidden>隔離した新しいタブで操作する</a></section><div class="run-tools"><label for="run-search">Run・Task・成果物 ID で探す<input id="run-search" type="search" autocomplete="off" placeholder="例: s10 / run_mimic" aria-controls="runs"></label><span id="run-count" role="status"></span></div><p id="selection-note" role="status"></p><div id="run-browser" class="run-browser"><section class="run-index" aria-label="Run 一覧"><h2>保存された Run</h2><div id="runs" class="run-list"></div></section><section id="run-detail" aria-label="選択した Run の詳細"></section></div></main></body></html>
