<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">DFD：信頼境界を重ねる</title>
<desc id="desc">注文照会の抜粋。信頼の前提が変わる場所と、管理範囲を区別する。</desc>
<rect x="0" y="0" width="1120" height="700" fill="#ffffff" stroke="none" stroke-width="2"/>
<text x="40" y="39" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start">MIMIC  /  DEVELOPMENT DIAGRAMS  /  17</text>
<text x="40" y="86" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="34" font-weight="600" text-anchor="start">DFD：信頼境界を重ねる</text>
<text x="40" y="122" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="21" font-weight="400" text-anchor="start">注文照会の抜粋。信頼の前提が変わる場所と、管理範囲を区別する。</text>
<line x1="40" y1="144" x2="1080" y2="144" stroke="#d8d8d8" stroke-width="2"/>
<line x1="40" y1="646" x2="1080" y2="646" stroke="#d8d8d8" stroke-width="2"/>
<text x="40" y="677" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start">説明用の架空例 · 図の前提と記法は説明文を参照</text>
<rect x="340" y="220" width="740" height="230" fill="#f5f5f5" stroke="#5e5e5e" stroke-width="2"/>
<text x="365" y="250" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="20" font-weight="400" text-anchor="start">同じ運営組織の管理範囲（実線の囲み）</text>
<line x1="300" y1="200" x2="300" y2="470" stroke="#171717" stroke-width="3" stroke-dasharray="10 8"/>
<line x1="750" y1="270" x2="750" y2="470" stroke="#171717" stroke-width="3" stroke-dasharray="10 8"/>
<text x="300" y="188" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="600" text-anchor="middle">T1</text>
<text x="750" y="493" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="600" text-anchor="middle">T2</text>
<rect x="60" y="290" width="190" height="110" fill="#ffffff" stroke="#171717" stroke-width="2"/>
<text x="155" y="333" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">購入者の</text>
<text x="155" y="365" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">クライアント</text>
<rect x="400" y="290" width="220" height="110" fill="#f5f5f5" stroke="#171717" stroke-width="2" rx="8"/>
<text x="510.0" y="326" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="23" font-weight="600" text-anchor="middle">照会API</text>
<text x="510.0" y="358" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">サービス実行権限</text>
<line x1="850" y1="290" x2="1050" y2="290" stroke="#171717" stroke-width="2"/>
<line x1="850" y1="400" x2="1050" y2="400" stroke="#171717" stroke-width="2"/>
<line x1="850" y1="290" x2="850" y2="400" stroke="#171717" stroke-width="2"/>
<text x="950.0" y="324" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="23" font-weight="600" text-anchor="middle">注文DB</text>
<text x="950.0" y="354" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">制限したDB権限</text>
<line x1="250" y1="315" x2="400" y2="315" stroke="#171717" stroke-width="2"/>
<polygon points="388.0,310.0 400,315 388.0,320.0" fill="#171717" stroke="#171717" stroke-width="2"/>
<text x="346" y="302" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">注文ID</text>
<line x1="400" y1="378" x2="250" y2="378" stroke="#171717" stroke-width="2"/>
<polygon points="262.0,383.0 250,378 262.0,373.0" fill="#171717" stroke="#171717" stroke-width="2"/>
<text x="350" y="409" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">注文状態</text>
<line x1="620" y1="315" x2="850" y2="315" stroke="#171717" stroke-width="2"/>
<polygon points="838.0,310.0 850,315 838.0,320.0" fill="#171717" stroke="#171717" stroke-width="2"/>
<text x="690" y="302" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">照会条件</text>
<line x1="850" y1="378" x2="620" y2="378" stroke="#171717" stroke-width="2"/>
<polygon points="632.0,383.0 620,378 632.0,373.0" fill="#171717" stroke="#171717" stroke-width="2"/>
<text x="690" y="409" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">注文記録</text>
<text x="60" y="530" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="21" font-weight="400" text-anchor="start">T1：利用者入力・本人・注文の所有者を確認する境界。</text>
<text x="60" y="567" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="21" font-weight="400" text-anchor="start">T2：同じ管理範囲の内部で、API権限からDB権限へ切り替わる境界。</text>
<text x="60" y="617" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start">凡例：破線＝信頼境界　実線の囲み＝管理範囲　境界だけで安全性は保証されない</text>
</svg>
