<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1560" role="img" aria-labelledby="title desc">
<title id="title">DFD：論理的なデータフロー</title>
<desc id="desc">受け取り・変換・保存・出力を、 業務で扱う情報の言葉で示す。</desc>
<rect x="0" y="0" width="680" height="1560" fill="#ffffff" stroke="none" stroke-width="2"/>
<text x="28" y="35" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start">MIMIC  /  DEVELOPMENT DIAGRAMS  /  15</text>
<text x="28" y="82" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="30" font-weight="600" text-anchor="start">DFD：論理的なデータフロー</text>
<text x="28" y="121" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">受け取り・変換・保存・出力を、</text>
<text x="28" y="157" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">業務で扱う情報の言葉で示す。</text>
<line x1="28" y1="172" x2="652" y2="172" stroke="#d8d8d8" stroke-width="2"/>
<line x1="28" y1="1504" x2="652" y2="1504" stroke="#d8d8d8" stroke-width="2"/>
<text x="28" y="1535" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start">架空の説明例 · 前提と記法は本文を参照</text>
<rect x="40" y="220" width="220" height="120" fill="#f5f5f5" stroke="#171717" stroke-width="2"/>
<text x="150.0" y="268.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">購入者</text>
<text x="150.0" y="310.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">外部実体</text>
<text x="420" y="251" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">同じ外部実体を</text>
<text x="420" y="288" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">上と下に再掲。</text>
<text x="420" y="325" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">受付と照会の</text>
<text x="420" y="362" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">情報を分けて読む。</text>
<rect x="40" y="480" width="220" height="180" fill="#f5f5f5" stroke="#171717" stroke-width="2" rx="16"/>
<text x="150.0" y="516.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">注文を</text>
<text x="150.0" y="558.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">受け付ける</text>
<text x="150.0" y="600.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">内容を確認し</text>
<text x="150.0" y="642.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">決済を依頼</text>
<rect x="420" y="480" width="220" height="180" fill="#f5f5f5" stroke="#171717" stroke-width="2"/>
<text x="530.0" y="558.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">決済サービス</text>
<text x="530.0" y="600.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">外部実体</text>
<line x1="40" y1="860" x2="260" y2="860" stroke="#171717" stroke-width="2"/>
<line x1="40" y1="1040" x2="260" y2="1040" stroke="#171717" stroke-width="2"/>
<line x1="40" y1="860" x2="40" y2="1040" stroke="#171717" stroke-width="2"/>
<text x="150.0" y="917.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">注文記録</text>
<text x="150.0" y="959.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">保存した注文と</text>
<text x="150.0" y="1001.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">決済状態</text>
<rect x="420" y="860" width="220" height="180" fill="#f5f5f5" stroke="#171717" stroke-width="2" rx="16"/>
<text x="530.0" y="896.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">注文状態を</text>
<text x="530.0" y="938.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">照会する</text>
<text x="530.0" y="980.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">注文IDに対応する</text>
<text x="530.0" y="1022.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">状態を返す</text>
<rect x="420" y="1250" width="220" height="120" fill="#f5f5f5" stroke="#171717" stroke-width="2"/>
<text x="530.0" y="1298.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">購入者</text>
<text x="530.0" y="1340.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">外部実体・再掲</text>
<line x1="150" y1="352" x2="150.0" y2="450.0" stroke="#171717" stroke-width="2.5"/>
<polygon points="150.00,468.00 157.00,450.00 143.00,450.00" fill="#171717" stroke="none"/>
<text x="178" y="418" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start">注文内容</text>
<line x1="272" y1="535" x2="390.0" y2="535.0" stroke="#171717" stroke-width="2.5"/>
<polygon points="408.00,535.00 390.00,528.00 390.00,542.00" fill="#171717" stroke="none"/>
<text x="340" y="510" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="middle">決済要求</text>
<line x1="408" y1="615" x2="290.0" y2="615.0" stroke="#171717" stroke-width="2.5"/>
<polygon points="272.00,615.00 290.00,622.00 290.00,608.00" fill="#171717" stroke="none"/>
<text x="340" y="591" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="middle">決済結果</text>
<line x1="150" y1="672" x2="150.0" y2="830.0" stroke="#171717" stroke-width="2.5"/>
<polygon points="150.00,848.00 157.00,830.00 143.00,830.00" fill="#171717" stroke="none"/>
<text x="180" y="741" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">注文と決済状態</text>
<text x="180" y="778" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">保存する情報</text>
<line x1="272" y1="940" x2="390.0" y2="940.0" stroke="#171717" stroke-width="2.5"/>
<polygon points="408.00,940.00 390.00,933.00 390.00,947.00" fill="#171717" stroke="none"/>
<text x="340" y="915" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">保存済み注文</text>
<line x1="408" y1="1020" x2="290.0" y2="1020.0" stroke="#171717" stroke-width="2.5"/>
<polygon points="272.00,1020.00 290.00,1027.00 290.00,1013.00" fill="#171717" stroke="none"/>
<text x="340" y="994" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">注文IDの条件</text>
<line x1="470" y1="1052" x2="470.0" y2="1220.0" stroke="#171717" stroke-width="2.5"/>
<polygon points="470.00,1238.00 477.00,1220.00 463.00,1220.00" fill="#171717" stroke="none"/>
<text x="444" y="1120" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="end">注文状態</text>
<line x1="590" y1="1238" x2="590.0" y2="1070.0" stroke="#171717" stroke-width="2.5"/>
<polygon points="590.00,1052.00 583.00,1070.00 597.00,1070.00" fill="#171717" stroke="none"/>
<text x="564" y="1200" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="end">注文ID</text>
<text x="36" y="1422" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="20" font-weight="400" text-anchor="start">長方形＝外部実体　角丸＝処理</text>
<text x="36" y="1455" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="20" font-weight="400" text-anchor="start">開いた箱＝保存先　矢印＝データの移動</text>
<text x="36" y="1488" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="20" font-weight="400" text-anchor="start">保存先の名前と、読み書きを明示する。</text>
</svg>
