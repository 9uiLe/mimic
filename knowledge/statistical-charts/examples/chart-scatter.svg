<circle cx="470.0" cy="480.83" r="8" fill="#171717" stroke="#171717" stroke-width="2.2"/>
<text x="483.0" y="462.83" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="600" text-anchor="start">G</text>
<circle cx="524.0" cy="416.67" r="8" fill="#171717" stroke="#171717" stroke-width="2.2"/>
<text x="537.0" y="398.67" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="600" text-anchor="start">H</text>
<line x1="28" y1="840" x2="652" y2="840" stroke="#d8d8d8" stroke-width="2"/>
<text x="28" y="878" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">区間A–H · 各区間100件の完了応答から</text>
<text x="28" y="910" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">p95を求めたと仮定。n=8組の架空集計値。</text>
<text x="28" y="942" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">点の上昇は関連を示す例。</text>
<text x="28" y="974" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">散布図だけで因果を証明しない。</text>
<text x="28" y="1006" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">環境差や第三の要因を確認する。</text>
</svg>
