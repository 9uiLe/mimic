<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1100" role="img" aria-labelledby="title desc">
<title id="title">散布図｜負荷と応答時間の関係</title>
<desc id="desc">別の架空データ · 8組の集計値。同じ1分区間の二つの値を1点で表す</desc>
<rect x="0" y="0" width="680" height="1100" fill="#ffffff" stroke="none" stroke-width="2"/>
<text x="28" y="34" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start">MIMIC / DEVELOPMENT DIAGRAMS / 25</text>
<text x="28" y="84" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="34" font-weight="600" text-anchor="start">散布図</text>
<text x="28" y="126" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="28" font-weight="500" text-anchor="start">負荷と応答時間の関係</text>
<text x="28" y="174" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start">別の架空データ · 8組の集計値</text>
<text x="28" y="209" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start">同じ1分区間の二つの値を1点で表す</text>
<line x1="28" y1="232" x2="652" y2="232" stroke="#d8d8d8" stroke-width="2"/>
<line x1="28" y1="1048" x2="652" y2="1048" stroke="#d8d8d8" stroke-width="2"/>
<text x="28" y="1079" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
