<circle cx="254.0" cy="615.0" r="8" fill="#171717" stroke="#171717" stroke-width="2.2"/>
<text x="267.0" y="597.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="600" text-anchor="start">C</text>
<circle cx="308.0" cy="597.5" r="8" fill="#171717" stroke="#171717" stroke-width="2.2"/>
<text x="321.0" y="579.5" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
