<circle cx="660" cy="188" r="6" fill="#171717" stroke="#171717" stroke-width="2"/>
<text x="679" y="195" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="20" font-weight="400" text-anchor="start">1点 = 同じ1分区間の組</text>
<text x="40" y="702" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="19" font-weight="400" text-anchor="start">区間A–H · 各区間100件の完了応答からp95を求めたと仮定 · n=8組の架空集計値。</text>
<text x="40" y="731" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="19" font-weight="400" text-anchor="start">点の上昇は関連を示す例。散布図だけで因果を証明せず、環境差や第三の要因を確認する。</text>
</svg>
