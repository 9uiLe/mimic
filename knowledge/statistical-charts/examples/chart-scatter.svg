<line x1="524.0" y1="720" x2="524.0" y2="729" stroke="#171717" stroke-width="2.2"/>
<text x="524.0" y="762" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">80</text>
<line x1="632.0" y1="720" x2="632.0" y2="729" stroke="#171717" stroke-width="2.2"/>
<text x="632.0" y="762" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
