<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1290" role="img" aria-labelledby="title desc">
<title id="title">ER図：概念モデル</title>
<desc id="desc">業務の対象と関連を確認する。 テーブル名・型・キーはまだ決めない。</desc>
<rect x="0" y="0" width="680" height="1290" fill="#ffffff" stroke="none" stroke-width="2"/>
<text x="28" y="35" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start">MIMIC  /  DEVELOPMENT DIAGRAMS  /  18</text>
<text x="28" y="82" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="30" font-weight="600" text-anchor="start">ER図：概念モデル</text>
<text x="28" y="121" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">業務の対象と関連を確認する。</text>
<text x="28" y="157" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">テーブル名・型・キーはまだ決めない。</text>
<line x1="28" y1="172" x2="652" y2="172" stroke="#d8d8d8" stroke-width="2"/>
<line x1="28" y1="1234" x2="652" y2="1234" stroke="#d8d8d8" stroke-width="2"/>
<text x="28" y="1265" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start">架空の説明例 · 前提と記法は本文を参照</text>
<rect x="190" y="220" width="300" height="110" fill="#f5f5f5" stroke="#171717" stroke-width="2"/>
<text x="340.0" y="284.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">顧客</text>
<rect x="190" y="510" width="300" height="110" fill="#f5f5f5" stroke="#171717" stroke-width="2"/>
<text x="340.0" y="574.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">注文</text>
<rect x="190" y="800" width="300" height="110" fill="#f5f5f5" stroke="#171717" stroke-width="2"/>
<text x="340.0" y="864.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">商品</text>
<line x1="340" y1="330" x2="340" y2="510" stroke="#171717" stroke-width="2.5"/>
<text x="365" y="362" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start">1</text>
<text x="365" y="492" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start">0..*</text>
<text x="310" y="428.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="end">発注する</text>
<line x1="340" y1="620" x2="340" y2="800" stroke="#171717" stroke-width="2.5"/>
<text x="365" y="652" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start">0..*</text>
<text x="365" y="782" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start">1..*</text>
<text x="310" y="718.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="end">含む</text>
<text x="36" y="967" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">注文と商品は多対多。数量・注文時単価は、</text>
<text x="36" y="1004" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">次の論理モデルで明細に置く。</text>
<text x="36" y="1041" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">受付済み注文には商品が必要。注文のない顧客・</text>
<text x="36" y="1078" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">まだ売れていない商品も存在できる。</text>
<text x="36" y="1125" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="20" font-weight="400" text-anchor="start">箱＝対象の型　線＝関連</text>
<text x="36" y="1158" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="20" font-weight="400" text-anchor="start">端の数値＝相手の1件に対応する、この側の件数</text>
<text x="36" y="1191" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="20" font-weight="400" text-anchor="start">1＝必ず1件　0..*＝0件以上　1..*＝1件以上</text>
</svg>
