<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1800" role="img" aria-labelledby="title desc">
<title id="title">ER図：論理モデル</title>
<desc id="desc">多対多を注文明細へ分け、 識別方法・属性・必須の関連を示す。</desc>
<rect x="0" y="0" width="680" height="1800" fill="#ffffff" stroke="none" stroke-width="2"/>
<text x="28" y="35" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start">MIMIC  /  DEVELOPMENT DIAGRAMS  /  19</text>
<text x="28" y="82" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="30" font-weight="600" text-anchor="start">ER図：論理モデル</text>
<text x="28" y="121" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">多対多を注文明細へ分け、</text>
<text x="28" y="157" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">識別方法・属性・必須の関連を示す。</text>
<line x1="28" y1="172" x2="652" y2="172" stroke="#d8d8d8" stroke-width="2"/>
<line x1="28" y1="1744" x2="652" y2="1744" stroke="#d8d8d8" stroke-width="2"/>
<text x="28" y="1775" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start">架空の説明例 · 前提と記法は本文を参照</text>
<rect x="120.0" y="220" width="440" height="150" fill="#ffffff" stroke="#171717" stroke-width="2"/>
<rect x="120.0" y="220" width="440" height="56" fill="#f5f5f5" stroke="#171717" stroke-width="2"/>
<text x="340" y="257" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">顧客</text>
<text x="340" y="313.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">顧客ID［主キー］</text>
<text x="340" y="347.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">表示名</text>
<rect x="120.0" y="550" width="440" height="180" fill="#ffffff" stroke="#171717" stroke-width="2"/>
<rect x="120.0" y="550" width="440" height="56" fill="#f5f5f5" stroke="#171717" stroke-width="2"/>
<text x="340" y="587" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">注文</text>
<text x="340" y="641.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">注文ID［主キー］</text>
<text x="340" y="675.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">顧客ID［必須参照］</text>
<text x="340" y="709.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">注文日時</text>
<rect x="120.0" y="910" width="440" height="220" fill="#ffffff" stroke="#171717" stroke-width="2"/>
<rect x="120.0" y="910" width="440" height="56" fill="#f5f5f5" stroke="#171717" stroke-width="2"/>
<text x="340" y="947" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">注文明細</text>
<text x="340" y="1004.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">注文ID［主キー・必須参照］</text>
<text x="340" y="1038.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">明細番号［主キー］</text>
<text x="340" y="1072.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">商品ID［必須参照］</text>
<text x="340" y="1106.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">数量・注文時単価</text>
<rect x="120.0" y="1330" width="440" height="150" fill="#ffffff" stroke="#171717" stroke-width="2"/>
<rect x="120.0" y="1330" width="440" height="56" fill="#f5f5f5" stroke="#171717" stroke-width="2"/>
<text x="340" y="1367" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle">商品</text>
<text x="340" y="1423.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">商品ID［主キー］</text>
<text x="340" y="1457.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle">商品名</text>
<line x1="340" y1="370" x2="340" y2="550" stroke="#171717" stroke-width="2.5" stroke-dasharray="9 7"/>
<text x="365" y="402" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start">1</text>
<text x="365" y="532" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start">0..*</text>
<text x="310" y="448.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="end">顧客が</text>
<text x="310" y="488.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="end">発注する</text>
<line x1="340" y1="730" x2="340" y2="910" stroke="#171717" stroke-width="2.5"/>
<text x="365" y="762" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start">1</text>
<text x="365" y="892" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start">1..*</text>
<text x="310" y="828.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="end">含む</text>
<line x1="340" y1="1130" x2="340" y2="1330" stroke="#171717" stroke-width="2.5" stroke-dasharray="9 7"/>
<text x="365" y="1162" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start">0..*</text>
<text x="365" y="1312" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start">1</text>
<text x="310" y="1218.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="end">商品が明細に</text>
<text x="310" y="1258.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="end">現れる</text>
<text x="36" y="1540" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">明細の主キーは、注文ID＋明細番号の組。</text>
<text x="36" y="1577" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start">必須の関連と識別関係を分けて読む。</text>
<text x="36" y="1640" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="20" font-weight="400" text-anchor="start">実線＝識別関係　破線＝非識別関係</text>
<text x="36" y="1673" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="20" font-weight="400" text-anchor="start">端の数値＝相手の1件に対応する、この側の件数</text>
<text x="36" y="1706" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="20" font-weight="400" text-anchor="start">1＝必ず1件　0..*＝0件以上　1..*＝1件以上</text>
</svg>
