<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790" role="img" aria-labelledby="comparison-title comparison-desc">
  <title id="comparison-title">重なる二つの面：不透明・半透明・影あり</title>
  <desc id="comparison-desc">
    各段で面Aが手前、面Bが奥。同じ位置と大きさで比較します。Aの斜線と塗りだけを半透明にし、輪郭と文字は残します。
    不透明では奥のBの格子が重なり部分で隠れ、半透明では透けます。影ありでは同じ前後関係に影だけを加えます。
    色の役割名と値は説明用の仮名です。sample-groundとsample-fillは白 #FFFFFF、sample-inkは #222222、
    sample-patternは #BBBBBB、sample-shadowは黒 #000000 の不透明度17%。白い台紙上の説明図で、製品の推奨配色ではありません。
    文字は日本語と英字のsans-serif、見出し26px・500、面名24px・500、説明24px・400、注記20px・400、字間0、行間34pxです。
    これらも説明図用の設定で、製品のTypographyの推奨値ではありません。
  </desc>
