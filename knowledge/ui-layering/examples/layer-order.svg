<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="order-title order-desc">
  <title id="order-title">暗い幕を置く順序で、暗くなる対象が変わる</title>
  <desc id="order-desc">
    架空の画面と不透明なダイアログを同じ位置・寸法で二回描いています。暗い幕は画面全体を覆う黒40%の面です。
    上段の順序は奥から画面、暗い幕、ダイアログ。画面が暗く、ダイアログは明るいままです。
    下段は奥から画面、ダイアログ、暗い幕。ダイアログの塗り・文字・輪郭・ボタンの絵も暗くなります。
    順序以外の位置、寸法、色、幕の不透明度は同じです。説明用の静止画で、操作やモーダル性の実装を示しません。
    色の役割名と値は説明用の仮名です。sample-groundとsample-dialogは白 #FFFFFF、sample-inkは #222222、
    sample-rowは #EEEEEE、sample-lineは #BBBBBB、sample-scrimは黒 #000000 の不透明度40%。製品の推奨配色ではありません。
    文字は日本語と英字のsans-serif、見出し26px・500、面内文字20px・400、説明24px・400、注記20px・400、字間0です。
    行間は説明で36px、面内で32px。説明図用の設定で、製品のTypographyの推奨値ではありません。
  </desc>
  <rect width="900" height="760" fill="#FFFFFF" />
  <g fill="#222222" font-family="sans-serif" font-weight="400">
    <g transform="translate(34 0)">
      <text x="0" y="40" font-size="26" font-weight="500">暗い幕がダイアログの後ろ</text>
      <g transform="translate(0 64)">
        <g>
          <g>
            <rect width="410" height="236" fill="#FFFFFF" />
            <rect x="0.75" y="0.75" width="408.5" height="234.5" fill="none" stroke="#222222" stroke-width="1.5" />
            <text x="18" y="33" font-size="20">画面：項目の一覧</text>
            <path d="M0 48H410" stroke="#BBBBBB" />
            <rect x="16" y="62" width="378" height="42" fill="#EEEEEE" />
            <rect x="16" y="116" width="378" height="42" fill="#EEEEEE" />
            <rect x="16" y="170" width="378" height="42" fill="#EEEEEE" />
            <g fill="none" stroke="#222222" stroke-width="1.5">
              <rect x="28" y="74" width="18" height="18" />
              <rect x="28" y="128" width="18" height="18" />
              <rect x="28" y="182" width="18" height="18" />
            </g>
            <g font-size="20">
              <text x="62" y="90">項目 A</text>
              <text x="62" y="144">項目 B</text>
              <text x="62" y="198">項目 C</text>
            </g>
          </g>
        </g>
        <g>
          <rect width="410" height="236" fill="#000000" opacity="0.4" />
        </g>
        <g>
          <g>
            <rect x="94" y="54" width="270" height="144" fill="#FFFFFF" stroke="#222222" stroke-width="1.5" />
            <text x="112" y="86" font-size="20" font-weight="500">ダイアログ</text>
            <text x="112" y="118" font-size="20">設定を確認します</text>
            <rect x="250" y="144" width="94" height="36" fill="#EEEEEE" stroke="#222222" />
            <text x="297" y="169" font-size="20" text-anchor="middle">確認</text>
          </g>
        </g>
      </g>
      <text x="446" y="116" font-size="20">奥 → 手前</text>
      <text x="446" y="152" font-size="24">画面 → 暗い幕 → ダイアログ</text>
      <text x="446" y="208" font-size="24">画面だけが暗くなる</text>
      <text x="446" y="244" font-size="24">ダイアログは明るいまま</text>
    </g>
    <g transform="translate(34 336)">
      <text x="0" y="40" font-size="26" font-weight="500">暗い幕がダイアログの手前</text>
      <g transform="translate(0 64)">
        <g>
          <g>
            <rect width="410" height="236" fill="#FFFFFF" />
            <rect x="0.75" y="0.75" width="408.5" height="234.5" fill="none" stroke="#222222" stroke-width="1.5" />
            <text x="18" y="33" font-size="20">画面：項目の一覧</text>
            <path d="M0 48H410" stroke="#BBBBBB" />
            <rect x="16" y="62" width="378" height="42" fill="#EEEEEE" />
            <rect x="16" y="116" width="378" height="42" fill="#EEEEEE" />
            <rect x="16" y="170" width="378" height="42" fill="#EEEEEE" />
            <g fill="none" stroke="#222222" stroke-width="1.5">
              <rect x="28" y="74" width="18" height="18" />
              <rect x="28" y="128" width="18" height="18" />
              <rect x="28" y="182" width="18" height="18" />
            </g>
            <g font-size="20">
              <text x="62" y="90">項目 A</text>
              <text x="62" y="144">項目 B</text>
              <text x="62" y="198">項目 C</text>
            </g>
          </g>
        </g>
        <g>
          <g>
            <rect x="94" y="54" width="270" height="144" fill="#FFFFFF" stroke="#222222" stroke-width="1.5" />
            <text x="112" y="86" font-size="20" font-weight="500">ダイアログ</text>
            <text x="112" y="118" font-size="20">設定を確認します</text>
            <rect x="250" y="144" width="94" height="36" fill="#EEEEEE" stroke="#222222" />
            <text x="297" y="169" font-size="20" text-anchor="middle">確認</text>
          </g>
        </g>
        <g>
          <rect width="410" height="236" fill="#000000" opacity="0.4" />
        </g>
      </g>
      <text x="446" y="116" font-size="20">奥 → 手前</text>
      <text x="446" y="152" font-size="24">画面 → ダイアログ → 暗い幕</text>
      <text x="446" y="208" font-size="24">ダイアログも暗くなる</text>
      <text x="446" y="244" font-size="24">文字・輪郭にも幕が重なる</text>
    </g>
    <text x="34" y="690" font-size="20">同じ位置・大きさ・不透明度40%の幕。変えたのは重ねる順序だけ。</text>
    <text x="34" y="726" font-size="20">見え方の比較です。操作を遮る仕組みやモーダル性の実装は示していません。</text>
  </g>
</svg>
