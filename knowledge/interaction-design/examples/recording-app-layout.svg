<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc">
  <title id="title">記録アプリの三画面 — 配置を読む静止見本</title>
  <desc id="desc">最初は記録0件の一覧から新規編集へ。保存成功後は詳細内に保存しましたと表示する。一覧図は保存後に戻った状態で、日付と本文冒頭から同じ記録を読み返せる。すべて仮データで操作と保存処理は未実装。</desc>
  <g fill="#202020" font-size="16" font-weight="400" letter-spacing="0"
    font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, sans-serif">
  <rect width="960" height="690" fill="#fff"/>
  <text x="20" y="27" font-size="20" font-weight="700">保存結果を理解して、後で読み返す</text>
  <text x="20" y="55" fill="#555" font-size="14">個人用モバイル / 日付＋本文 / 端末内保存を目指す仮案</text>
  <text x="20" y="88" fill="#555" font-size="14">初めは記録0件。一覧の図は、保存して戻った時点を示す。</text>

  <text x="20" y="125" font-size="20" font-weight="700">① 一覧</text>
  <text x="340" y="125" font-size="20" font-weight="700">② 編集</text>
  <text x="660" y="125" font-size="20" font-weight="700">③ 保存後の詳細</text>
  <text x="20" y="149" fill="#555" font-size="14">探す・新しく記録する</text>
  <text x="340" y="149" fill="#555" font-size="14">出来事の日付と本文を入力する</text>
  <text x="660" y="149" fill="#555" font-size="14">保存結果を知る・本文を読む</text>

  <rect x="20" y="168" width="280" height="374" rx="8" fill="#fff" stroke="#202020" stroke-width="2"/>
  <text x="40" y="205" font-size="20" font-weight="700">記録一覧</text>
  <path d="M20 224 H300" fill="none" stroke="#777"/>
  <rect x="40" y="244" width="240" height="44" rx="3" fill="#fff" stroke="#202020"/>
  <text x="160" y="272" text-anchor="middle">新しい記録</text>
  <rect x="40" y="310" width="240" height="100" rx="3" fill="#f2f2f2" stroke="#777"/>
  <text x="56" y="341">2026/10/20</text>
  <text x="56" y="372">公園で友人と話した</text>
  <text x="40" y="449" fill="#555" font-size="14">保存後は日付と本文冒頭で探す</text>
  <text x="40" y="473" fill="#555" font-size="14">記録を選ぶ → ③で読み返す</text>

  <rect x="340" y="168" width="280" height="374" rx="8" fill="#fff" stroke="#202020" stroke-width="2"/>
  <rect x="356" y="181" width="68" height="32" rx="3" fill="#fff" stroke="#202020"/>
  <text x="390" y="203" text-anchor="middle">戻る</text>
  <text x="480" y="204" text-anchor="middle" font-size="20" font-weight="700">編集</text>
  <rect x="536" y="181" width="68" height="32" rx="3" fill="#fff" stroke="#202020"/>
  <text x="570" y="203" text-anchor="middle">保存</text>
  <path d="M340 224 H620" fill="none" stroke="#777"/>
  <text x="360" y="255">日付</text>
  <rect x="360" y="267" width="240" height="42" rx="3" fill="#f2f2f2" stroke="#777"/>
  <text x="376" y="294">2026/10/20</text>
  <text x="360" y="341">本文</text>
  <rect x="360" y="353" width="240" height="130" rx="3" fill="#f2f2f2" stroke="#777"/>
  <text x="376" y="384">公園で友人と話した</text>
  <text x="360" y="516" fill="#555" font-size="14">未保存</text>

  <rect x="660" y="168" width="280" height="374" rx="8" fill="#fff" stroke="#202020" stroke-width="2"/>
  <rect x="676" y="181" width="68" height="32" rx="3" fill="#fff" stroke="#202020"/>
  <text x="710" y="203" text-anchor="middle">戻る</text>
  <text x="800" y="204" text-anchor="middle" font-size="20" font-weight="700">詳細</text>
  <rect x="856" y="181" width="68" height="32" rx="3" fill="#fff" stroke="#202020"/>
  <text x="890" y="203" text-anchor="middle">編集</text>
  <path d="M660 224 H940" fill="none" stroke="#777"/>
  <rect x="680" y="244" width="240" height="42" rx="3" fill="#f2f2f2" stroke="#777"/>
  <text x="800" y="271" text-anchor="middle">保存しました</text>
  <text x="680" y="325">2026/10/20</text>
  <text x="680" y="367">公園で友人と話した</text>
  <text x="680" y="449" fill="#555" font-size="14">保存直後だけ成功を表示</text>
  <text x="680" y="473" fill="#555" font-size="14">一覧から開くと成功表示なし</text>

  <path d="M180 565 H457" fill="none" stroke="#202020" stroke-width="1.5"/>
  <path d="M449.125 560.5 L458.125 565 L449.125 569.5" fill="#202020"/>
  <text x="320" y="587" fill="#555" font-size="14" text-anchor="middle">①の新規入口 → ②</text>
  <path d="M500 565 H817" fill="none" stroke="#202020" stroke-width="1.5"/>
  <path d="M809.125 560.5 L818.125 565 L809.125 569.5" fill="#202020"/>
  <text x="658" y="587" fill="#555" font-size="14" text-anchor="middle">②で保存成功 → ③</text>
  <text x="20" y="618" fill="#555" font-size="14">③の「戻る」→ ① / ①で記録を選ぶ → ③ / ③の「編集」→ ②</text>
  <text x="20" y="647" fill="#555" font-size="14">静止図・操作不可。仮データ一件。実保存、エラー、復旧は未実装。使いやすさは未確認。</text>
  <text x="20" y="674" fill="#555" font-size="14">配置・相対的な大きさを読むための説明用仮スタイル。完成デザインではない。</text>
  </g>
</svg>
