<line x1="785" y1="535" x2="710" y2="535" stroke="#171717" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="710,528 695,535 710,542" fill="#ffffff" stroke="#171717" stroke-width="2"/>
<text x="740" y="512" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">実現</text>
<text x="65" y="665" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="19" font-weight="400" text-anchor="start">凡例：破線＋開いた矢印＝依存。破線＋白抜き三角＝インターフェースの実現。</text>
<text x="65" y="695" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="19" font-weight="400" text-anchor="start">提供契約を別の長方形で示した例。実行時の呼出し順序は表さない。</text>
</svg>
