<line x1="785" y1="285" x2="710" y2="285" stroke="#171717" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="710,278 695,285 710,292" fill="#ffffff" stroke="#171717" stroke-width="2"/>
<text x="740" y="262" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
