<text x="920.0" y="298" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">«component»</text>
<line x1="335" y1="285" x2="425" y2="285" stroke="#171717" stroke-width="2" stroke-dasharray="7 5"/>
<polyline points="413.0,280.0 425,285 413.0,290.0" fill="none" stroke="#171717" stroke-width="2"/>
<text x="380" y="262" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
