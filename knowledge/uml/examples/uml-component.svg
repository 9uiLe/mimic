<line x1="920" y1="340" x2="560" y2="480" stroke="#171717" stroke-width="2" stroke-dasharray="7 5"/>
<polyline points="573.0,480.3 560,480 569.4,471.0" fill="none" stroke="#171717" stroke-width="2"/>
<text x="690" y="400" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
