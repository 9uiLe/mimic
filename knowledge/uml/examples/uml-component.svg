<text x="560.0" y="298" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">«interface»</text>
<rect x="785" y="230" width="270" height="110" fill="#f5f5f5" stroke="#171717" stroke-width="2"/>
<text x="920.0" y="266" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
