<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1190" role="img" aria-labelledby="title desc">
<title id="title">UML · ユースケース図</title>
<desc id="desc">外部の役割と、注文システムで達成する目的を分ける</desc>
<rect x="0" y="0" width="680" height="1190" fill="#ffffff" stroke="none" stroke-width="3"/>
<text x="24" y="29" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
