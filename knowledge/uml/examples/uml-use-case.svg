<circle cx="470" cy="215" r="20" fill="#ffffff" stroke="#171717" stroke-width="3"/>
<line x1="470" y1="235" x2="470" y2="291" stroke="#171717" stroke-width="3"/>
<line x1="440" y1="257" x2="500" y2="257" stroke="#171717" stroke-width="3"/>
