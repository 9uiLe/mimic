<text x="24" y="1374" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">矢印＝トリガー [ガード] / 効果</text>
<text x="24" y="1408" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">終了・取消・返金は省略。</text>
</svg>
