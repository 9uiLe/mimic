<text x="540" y="755.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">未決済確定</text>
<polyline points="340,890 340.0,1124.0" fill="none" stroke="#171717" stroke-width="3"/>
<polygon points="348.0,1124.0 340.0,1142.0 332.0,1124.0" fill="#171717" stroke="none" stroke-width="2"/>
<text x="475" y="970.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">照会で承認確定</text>
<text x="475" y="1010.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">[金額一致]</text>
<text x="475" y="1050.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">/ 承認IDを記録</text>
<text x="24" y="1300" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
