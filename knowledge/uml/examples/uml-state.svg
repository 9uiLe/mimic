<polyline points="210,425 75,425 75,1195 184.0,1195.0" fill="none" stroke="#171717" stroke-width="3"/>
<polygon points="184.0,1187.0 202.0,1195.0 184.0,1203.0" fill="#171717" stroke="none" stroke-width="2"/>
