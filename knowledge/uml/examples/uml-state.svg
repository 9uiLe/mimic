<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1500" role="img" aria-labelledby="title desc">
<title id="title">UML · 状態機械図</title>
<desc id="desc">支払待ち・支払済み・結果確認中と、遷移を許す条件を示す</desc>
<rect x="0" y="0" width="680" height="1500" fill="#ffffff" stroke="none" stroke-width="3"/>
<text x="24" y="29" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">MIMIC / DEVELOPMENT DIAGRAMS / 13</text>
<text x="24" y="70" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="32" font-weight="600" text-anchor="start" dominant-baseline="central">UML · 状態機械図</text>
<text x="24" y="119.0" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">支払待ち・支払済み・結果確認中と、</text>
<text x="24" y="153.0" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">遷移を許す条件を示す</text>
<line x1="24" y1="180" x2="656" y2="180" stroke="#d8d8d8" stroke-width="2"/>
<line x1="24" y1="1436" x2="656" y2="1436" stroke="#d8d8d8" stroke-width="2"/>
<text x="24" y="1471" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
