<rect x="210" y="1150" width="260" height="90" fill="#f5f5f5" stroke="#171717" stroke-width="3" rx="24"/>
<text x="340.0" y="1195.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">支払済み</text>
<circle cx="340" cy="220" r="13" fill="#171717" stroke="#171717" stroke-width="3"/>
<polyline points="340,233 340.0,354.0" fill="none" stroke="#171717" stroke-width="3"/>
<polygon points="348.0,354.0 340.0,372.0 332.0,354.0" fill="#171717" stroke="none" stroke-width="2"/>
<polyline points="470,405 550,405 550,300 405,300 405.0,354.0" fill="none" stroke="#171717" stroke-width="3"/>
<polygon points="413.0,354.0 405.0,372.0 397.0,354.0" fill="#171717" stroke="none" stroke-width="2"/>
<text x="520" y="215.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
