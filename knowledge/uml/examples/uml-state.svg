<polyline points="470,845 630,845 630,450 496.0,450.0" fill="none" stroke="#171717" stroke-width="3"/>
<polygon points="496.0,458.0 478.0,450.0 496.0,442.0" fill="#171717" stroke="none" stroke-width="2"/>
<text x="540" y="715.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
