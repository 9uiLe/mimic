<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">UML · 状態機械図</title>
<desc id="desc">支払待ち・支払済み・結果確認中と、遷移を許す条件</desc>
<rect x="0" y="0" width="1120" height="850" fill="#ffffff" stroke="none" stroke-width="2"/>
