<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1120" role="img" aria-labelledby="title desc">
<title id="title">フローチャート：注文入力の検証</title>
<desc id="desc">判断条件で処理を分ける。矢印は処理の進行方向。入力が有効なら右へ進んで保存し、無効なら左へ進んでエラーを表示する。</desc>
<rect x="0" y="0" width="680" height="1120" rx="0" fill="#ffffff" stroke="none" stroke-width="2.4"/>
<text x="24" y="28" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">MIMIC  /  DEVELOPMENT DIAGRAMS  /  29</text>
<text x="24" y="76" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="31" font-weight="600" text-anchor="start" dominant-baseline="central">フローチャート：注文入力の検証</text>
<text x="24" y="116" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">判断条件で処理を分ける。矢印は処理の進行方向。</text>
<line x1="24" y1="144" x2="656" y2="144" stroke="#d8d8d8" stroke-width="1.6" stroke-linecap="round"/>
<rect x="260" y="180" width="160" height="56" rx="28" fill="#f5f5f5" stroke="#171717" stroke-width="2.4"/>
<text x="340" y="208" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">開始</text>
<line x1="340" y1="248" x2="340" y2="276" stroke="#171717" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="331,276 349,276 340,290" fill="#171717" stroke="none"/>
<rect x="200" y="302" width="280" height="84" rx="6" fill="#ffffff" stroke="#171717" stroke-width="2.4"/>
<text x="340" y="344" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">注文内容を検証する</text>
<line x1="340" y1="398" x2="340" y2="424" stroke="#171717" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="331,424 349,424 340,438" fill="#171717" stroke="none"/>
<polygon points="340,450 460,510 340,570 220,510" fill="#f5f5f5" stroke="#171717" stroke-width="2.4"/>
<text x="340" y="510" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">入力は有効？</text>
<text x="170" y="478" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">いいえ</text>
<line x1="208" y1="510" x2="170" y2="510" stroke="#171717" stroke-width="2.4" stroke-linecap="round"/>
<line x1="170" y1="510" x2="170" y2="624" stroke="#171717" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="161,624 179,624 170,638" fill="#171717" stroke="none"/>
<text x="510" y="478" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">はい</text>
<line x1="472" y1="510" x2="510" y2="510" stroke="#171717" stroke-width="2.4" stroke-linecap="round"/>
<line x1="510" y1="510" x2="510" y2="624" stroke="#171717" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="501,624 519,624 510,638" fill="#171717" stroke="none"/>
<rect x="30" y="650" width="280" height="92" rx="6" fill="#ffffff" stroke="#171717" stroke-width="2.4"/>
<text x="170" y="696" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">入力エラーを表示</text>
<rect x="370" y="650" width="280" height="92" rx="6" fill="#ffffff" stroke="#171717" stroke-width="2.4"/>
<text x="510" y="696" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">注文を保存する</text>
<line x1="170" y1="754" x2="170" y2="804" stroke="#171717" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="161,804 179,804 170,818" fill="#171717" stroke="none"/>
<rect x="30" y="830" width="280" height="92" rx="38" fill="#f5f5f5" stroke="#171717" stroke-width="2.4"/>
<text x="170" y="859" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">終了：未受付</text>
<text x="170" y="893" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">入力内容は保持する</text>
<line x1="510" y1="754" x2="510" y2="804" stroke="#171717" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="501,804 519,804 510,818" fill="#171717" stroke="none"/>
<rect x="370" y="830" width="280" height="92" rx="38" fill="#f5f5f5" stroke="#171717" stroke-width="2.4"/>
<text x="510" y="876" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">終了：受付完了</text>
<text x="24" y="970" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="600" text-anchor="start" dominant-baseline="central">凡例</text>
<text x="24" y="1010" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">角丸：開始・終了</text>
<text x="265" y="1010" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">長方形：処理</text>
<text x="464" y="1010" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">ひし形：判断</text>
<text x="24" y="1048" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">保存失敗や再入力はこの例では省略。</text>
<line x1="24" y1="1076" x2="656" y2="1076" stroke="#d8d8d8" stroke-width="1.6" stroke-linecap="round"/>
<text x="24" y="1098" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">説明用の架空例 · 図の前提と記法は説明文を参照</text>
</svg>
