<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1210" role="img" aria-labelledby="title desc">
<title id="title">C4 · System Context</title>
<desc id="desc">注文システム全体：利用者と、。直接連携する外部システムを見る</desc>
<rect x="0" y="0" width="680" height="1210" rx="0" fill="#ffffff" stroke="none" stroke-width="2.4"/>
<text x="24" y="28" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">MIMIC  /  DEVELOPMENT DIAGRAMS  /  01</text>
<text x="24" y="76" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="31" font-weight="600" text-anchor="start" dominant-baseline="central">C4 · System Context</text>
<text x="24" y="119" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">注文システム全体：利用者と、</text>
<text x="24" y="153" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">直接連携する外部システムを見る</text>
<line x1="24" y1="175" x2="656" y2="175" stroke="#d8d8d8" stroke-width="1.6"/>
<line x1="24" y1="1166" x2="656" y2="1166" stroke="#d8d8d8" stroke-width="1.6"/>
<text x="24" y="1188" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">説明用の架空例 · 図の前提と記法は説明文を参照</text>
<text x="24" y="211" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="600" text-anchor="start" dominant-baseline="central">何が対象で、誰と何のために関わるか</text>
<rect x="180" y="250" width="320" height="150" rx="8" fill="#ffffff" stroke="#171717" stroke-width="2.4"/>
<text x="340.0" y="287.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">購入者</text>
<text x="340.0" y="327.0" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">Person</text>
<text x="340.0" y="365.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">商品を注文する人</text>
<rect x="140" y="500" width="400" height="180" rx="8" fill="#f5f5f5" stroke="#171717" stroke-width="2.4"/>
<text x="340.0" y="533.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">注文システム</text>
<text x="340.0" y="573.0" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">Software System</text>
<text x="340.0" y="611.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">注文を受け付け、</text>
<text x="340.0" y="649.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">支払処理を依頼する</text>
<rect x="180" y="780" width="320" height="150" rx="8" fill="#ffffff" stroke="#171717" stroke-width="2.4"/>
<text x="340.0" y="817.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">決済サービス</text>
<text x="340.0" y="857.0" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">External System</text>
<text x="340.0" y="895.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">支払処理を行う</text>
<line x1="340.0" y1="412.0" x2="340.0" y2="474.0" stroke="#171717" stroke-width="2.4"/>
<polygon points="349,474 340,488 331,474" fill="#171717" stroke="none"/>
<text x="372" y="450" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start" dominant-baseline="central">注文を登録</text>
<line x1="340.0" y1="692.0" x2="340.0" y2="754.0" stroke="#171717" stroke-width="2.4"/>
<polygon points="349,754 340,768 331,754" fill="#171717" stroke="none"/>
<text x="372" y="730" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="400" text-anchor="start" dominant-baseline="central">支払処理を依頼</text>
<text x="24" y="980" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">中央の注文システムを、Container図で開く。</text>
<text x="24" y="1024" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="600" text-anchor="start" dominant-baseline="central">凡例</text>
<text x="24" y="1062" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">矢印：利用・依頼の方向。応答・順序は省略。</text>
<text x="24" y="1100" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">内部のAPI・DB・通信方式は扱わない。</text>
</svg>
