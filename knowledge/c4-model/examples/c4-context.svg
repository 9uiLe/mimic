<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">C4 · System Context</title>
<desc id="desc">注文システム全体：利用者と、直接連携する外部システム</desc>
<rect x="0" y="0" width="1120" height="700" fill="#ffffff" stroke="none" stroke-width="2"/>
<text x="40" y="39" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start">MIMIC  /  DEVELOPMENT DIAGRAMS  /  01</text>
<text x="40" y="86" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="34" font-weight="600" text-anchor="start">C4 · System Context</text>
<text x="40" y="122" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="21" font-weight="400" text-anchor="start">注文システム全体：利用者と、直接連携する外部システム</text>
<line x1="40" y1="144" x2="1080" y2="144" stroke="#d8d8d8" stroke-width="2"/>
<line x1="40" y1="646" x2="1080" y2="646" stroke="#d8d8d8" stroke-width="2"/>
<text x="40" y="677" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="start">説明用の架空例 · 図の前提と記法は説明文を参照</text>
<text x="40" y="200" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="22" font-weight="600" text-anchor="start">何が対象で、誰と何のために関わるか</text>
<rect x="50" y="285" width="230" height="145" fill="#ffffff" stroke="#171717" stroke-width="2" rx="8"/>
<text x="165.0" y="320" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="600" text-anchor="middle">購入者</text>
<text x="165.0" y="352" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">Person</text>
<text x="165.0" y="384" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="19" font-weight="400" text-anchor="middle">商品を注文する人</text>
<rect x="430" y="265" width="270" height="185" fill="#f5f5f5" stroke="#171717" stroke-width="2" rx="8"/>
<text x="565.0" y="300" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="600" text-anchor="middle">注文システム</text>
<text x="565.0" y="332" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">Software System</text>
<text x="565.0" y="364" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="19" font-weight="400" text-anchor="middle">注文を受け付け、</text>
<text x="565.0" y="391" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="19" font-weight="400" text-anchor="middle">支払処理を依頼する</text>
<rect x="850" y="285" width="230" height="145" fill="#ffffff" stroke="#171717" stroke-width="2" rx="8"/>
<text x="965.0" y="320" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="24" font-weight="600" text-anchor="middle">決済サービス</text>
<text x="965.0" y="352" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">External System</text>
<text x="965.0" y="384" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="19" font-weight="400" text-anchor="middle">支払処理を行う</text>
<line x1="280" y1="355" x2="430" y2="355" stroke="#171717" stroke-width="2"/>
<polygon points="418.0,350.0 430,355 418.0,360.0" fill="#171717" stroke="#171717" stroke-width="2"/>
<text x="355.0" y="343.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">注文を登録</text>
<line x1="700" y1="355" x2="850" y2="355" stroke="#171717" stroke-width="2"/>
<polygon points="838.0,350.0 850,355 838.0,360.0" fill="#171717" stroke="#171717" stroke-width="2"/>
<text x="775.0" y="343.0" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="18" font-weight="400" text-anchor="middle">支払処理を依頼</text>
<text x="565" y="485" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="21" font-weight="400" text-anchor="middle">この一つの箱を、次のContainer図で開く</text>
<line x1="50" y1="555" x2="110" y2="555" stroke="#171717" stroke-width="2"/>
<polygon points="98.0,550.0 110,555 98.0,560.0" fill="#171717" stroke="#171717" stroke-width="2"/>
<text x="130" y="562" fill="#171717" font-family="Noto Sans CJK JP, sans-serif"
 font-size="20" font-weight="400" text-anchor="start">矢印：利用・依頼の方向。応答と処理順序は省略。</text>
<text x="50" y="605" fill="#5e5e5e" font-family="Noto Sans CJK JP, sans-serif"
 font-size="20" font-weight="400" text-anchor="start">内部のAPI・DB・通信方式は、この図では扱わない。</text>
</svg>
